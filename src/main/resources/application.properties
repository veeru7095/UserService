spring.application.name=UserService

server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/veerudb
spring.datasource.username=root
spring.datasource.password=veeru


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true

eureka.client.fetch-registry=true

resilience4j.retry.instances.inventoryRetry.max-attempts=3
resilience4j.retry.instances.inventoryRetry.wait-duration=2s

resilience4j.retry.instances.inventoryRetry.retry-exceptions[0]=feign.FeignException$ServiceUnavailable
resilience4j.retry.instances.inventoryRetry.retry-exceptions[1]=feign.RetryableException